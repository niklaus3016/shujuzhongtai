<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>测试 /admin/account/list 接口</h1>
    <button onclick="testAPI()">测试接口</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            const token = localStorage.getItem('admin_token');
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('https://wfqmaepvjkdd.sealoshzh.site/api/admin/account/list', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : ''
                    }
                });
                
                const data = await response.json();
                
                // 统计各类账号
                const allAccounts = data.admins || data || [];
                const normalAdmins = allAccounts.filter(a => a.role === 'NORMAL_ADMIN');
                const groupLeaders = allAccounts.filter(a => a.role === 'GROUP_LEADER' || a.role === 'group_leader');
                const superAdmins = allAccounts.filter(a => a.role === 'SUPER_ADMIN');
                
                resultDiv.innerHTML = `
<strong>接口返回统计：</strong>
总账号数: ${allAccounts.length}
NORMAL_ADMIN (团队长): ${normalAdmins.length}
GROUP_LEADER (组长): ${groupLeaders.length}
SUPER_ADMIN (超管): ${superAdmins.length}

<strong>团队长列表：</strong>
${normalAdmins.map(a => `- ${a.realName || a.username} (${a.teamName})`).join('\n')}

<strong>原始数据：</strong>
${JSON.stringify(data, null, 2)}
                `;
            } catch (error) {
                resultDiv.innerHTML = `错误: ${error.message}`;
            }
        }
    </script>
</body>
</html>
